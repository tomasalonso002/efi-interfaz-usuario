<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Nuevo Voluntario - Administración | Patitas Conectadas</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .vol-form-card {
      background-color: var(--bg-surface);
      border-radius: var(--radius-xl);
      padding: clamp(1.25rem, 3.5vw, 2.25rem);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <!-- Header Administrador -->
    <header class="app-header">
      <div class="d-flex align-center gap-2">
        <a href="voluntarios.html" class="btn-icon" aria-label="Volver a lista" title="Volver">
          ‹
        </a>
        <button class="btn-icon" id="openDrawerBtn" aria-label="Abrir menú" onclick="toggleDrawer()">
          ☰
        </button>
      </div>

      <div class="brand-badge">
        <span class="brand-paw">🐾</span>
        <span>PATITAS CONECTADAS</span>
      </div>

      <div class="d-flex align-center gap-2">
        <span class="role-badge role-badge--admin">ADMIN</span>
      </div>
    </header>

    <main class="app-main" id="main-content">

      <!-- Título de Sección -->
      <section class="mb-2 text-center text-md-left" style="max-width: 680px; margin-left: auto; margin-right: auto; width: 100%;">
        <h1 class="title-hero" style="font-size: 1.65rem;">VOLUNTARIOS</h1>
        <p class="text-caption text-bold text-primary text-uppercase mt-1" style="letter-spacing: 0.08em;">
          Crear Nuevo Voluntario
        </p>
      </section>

      <!-- Formulario de Alta de Voluntario (Fiel a Stitch) -->
      <form class="vol-form-card" id="nuevoVoluntarioForm" onsubmit="handleCreateVolunteer(event)">
        
        <!-- Fila 1: Nombre y Apellido -->
        <div class="grid-2">
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="volNombre">Nombre</label>
            <input type="text" id="volNombre" class="form-control" placeholder="Ej. Tomas" required>
          </div>
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="volApellido">Apellido</label>
            <input type="text" id="volApellido" class="form-control" placeholder="Ej. Alonso" required>
          </div>
        </div>

        <!-- Fila 2: DNI y Teléfono -->
        <div class="grid-2">
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="volDni">DNI</label>
            <input type="text" id="volDni" class="form-control" placeholder="44606642" inputmode="numeric" required>
          </div>
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="volTel">Teléfono</label>
            <input type="tel" id="volTel" class="form-control" placeholder="3587489652" required>
          </div>
        </div>

        <!-- Gmail -->
        <div class="form-group" style="margin: 0;">
          <label class="form-label" for="volEmail">Gmail</label>
          <div class="input-wrapper has-right-icon">
            <input type="email" id="volEmail" class="form-control" placeholder="tomas@gmail.com" required>
            <span class="input-icon-right" style="pointer-events: none;">@</span>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group" style="margin: 0;">
          <label class="form-label" for="volPass">Contraseña</label>
          <div class="input-wrapper has-right-icon">
            <input type="password" id="volPass" class="form-control" placeholder="••••••••••••" required>
            <button type="button" class="input-icon-right" aria-label="Mostrar contraseña" onclick="togglePass('volPass', this)" style="background: none; border: none;">
              👁️
            </button>
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="form-group" style="margin: 0;">
          <label class="form-label" for="volPassConfirm">Confirmar Contraseña</label>
          <div class="input-wrapper has-right-icon">
            <input type="password" id="volPassConfirm" class="form-control" placeholder="••••••••••••" required>
            <button type="button" class="input-icon-right" aria-label="Mostrar contraseña" onclick="togglePass('volPassConfirm', this)" style="background: none; border: none;">
              👁️
            </button>
          </div>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-3" style="box-shadow: 0 8px 24px rgba(223, 112, 84, 0.35);">
          <span>Crear Cuenta</span>
          <span aria-hidden="true">→</span>
        </button>

      </form>

    </main>

    <!-- Footer común -->
    <footer class="app-footer">
      <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm" style="border-radius: var(--radius-sm); font-size: 0.8rem;">
        <span style="color: #df7054;">🗺️</span>
        <span>Maps</span>
      </a>
      <p class="footer-copy">Todos los derechos reservados</p>
    </footer>

  </div>

  <!-- Drawer Lateral -->
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="if(event.target === this) toggleDrawer()">
    <aside class="drawer-menu" aria-label="Menú de administración">
      <div class="d-flex align-center justify-between">
        <div class="d-flex align-center gap-2">
          <div class="brand-paw" style="font-size: 1.8rem; background: #fff1eb; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md);">
            🐾
          </div>
          <div>
            <div class="d-flex align-center gap-2">
              <span class="text-bold text-main" style="letter-spacing: 0.05em; font-size: 1.05rem;">PATITAS</span>
              <span class="badge" style="background-color: #fef2f0; color: #df7054; border: 1px solid #f8cfc5; font-size: 0.65rem; padding: 2px 6px;">ADMIN</span>
            </div>
            <p class="text-caption text-muted">Gestión y Bienestar Animal</p>
          </div>
        </div>
        <button class="btn-icon" aria-label="Cerrar menú" onclick="toggleDrawer()" style="width: 36px; height: 36px;">
          ✕
        </button>
      </div>

      <nav class="d-flex flex-column gap-2 mt-3" aria-label="Navegación">
        <a href="inicio.html" class="drawer-nav-item">
          <div class="drawer-nav-item__left"><span>🏠</span><span>Inicio</span></div>
          <span>›</span>
        </a>
        <a href="voluntarios.html" class="drawer-nav-item is-active">
          <div class="drawer-nav-item__left"><span>👥</span><span>Voluntarios</span></div>
          <span>●</span>
        </a>
      </nav>

      <div class="mt-auto d-flex flex-column gap-2">
        <a href="../autenticacion/inicio.html" class="btn btn-secondary btn-block">
          <span>🚪</span>
          <span>Cerrar Sesión</span>
        </a>
      </div>
    </aside>
  </div>

  <script>
    function toggleDrawer() {
      document.getElementById('drawerBackdrop').classList.toggle('is-open');
    }
    function togglePass(inputId, btn) {
      const inp = document.getElementById(inputId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
    }
    function handleCreateVolunteer(e) {
      e.preventDefault();
      const p1 = document.getElementById('volPass').value;
      const p2 = document.getElementById('volPassConfirm').value;
      if (p1 !== p2) {
        alert('Las contraseñas no coinciden.');
        return;
      }
      alert('¡Cuenta de voluntario creada exitosamente!');
      window.location.href = 'voluntarios.html';
    }
  </script>
</body>
</html>
